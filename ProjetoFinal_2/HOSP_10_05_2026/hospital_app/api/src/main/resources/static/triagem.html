<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem - Cuidar+</title>
    <style>
        /* Identidade Cromática Exata do App Cuidar+ */
        :root {
            --primary-dark: #004b49;
            --accent-light: #98e6ec;
            --accent-text: #0d8389;
            --bg-light: #f7fafc;
            --text-dark: #1a1a1a;
            --text-muted: #666666;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 75, 73, 0.05);
            width: 100%;
            max-width: 550px;
            border: 1px solid rgba(0, 75, 73, 0.1);
        }

        .header-triagem {
            margin-bottom: 25px;
        }

        .header-triagem h2 {
            color: var(--primary-dark);
            margin: 0;
            font-size: 26px;
            font-weight: 700;
        }

        .header-triagem p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 18px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: var(--primary-dark);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e1e8ed;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            color: var(--text-dark);
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-text);
            box-shadow: 0 0 0 3px rgba(152, 230, 236, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-dark);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.99);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            display: none;
        }

        /* Destaque visual para o alerta de idade */
        .alerta-risco {
            color: #c5221f;
            font-size: 12px;
            font-weight: 700;
            display: none;
            margin-top: 6px;
            background-color: #fce8e6;
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-triagem">
        <h2>Cuidar+</h2>
        <p>Formulário de Triagem Inteligente</p>
    </div>

    <form id="formTriagem">
        <div class="form-group">
            <label for="pacienteNome">Nome do Paciente *</label>
            <input type="text" id="pacienteNome" placeholder="Nome completo" required>
        </div>

        <div class="form-group">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" placeholder="Ex: 123.456.789-00" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="idade">Idade</label>
                <input type="number" id="idade" placeholder="Ex: 35">
            </div>

            <div class="form-group">
                <label for="nivelUrgencia">Urgência *</label>
                <select id="nivelUrgencia" required>
                    <option value="">Selecione...</option>
                    <option value="Verde">Verde (Pouco Urgente)</option>
                    <option value="Amarelo">Amarelo (Urgente)</option>
                    <option value="Vermelho">Vermelho (Emergência)</option>
                </select>
                <div id="alertaIdade" class="alerta-risco">⚠️ Risco Elevado: Paciente Idoso</div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="pressaoArterial">Pressão Arterial</label>
                <input type="text" id="pressaoArterial" placeholder="Ex: 12/8">
            </div>

            <div class="form-group">
                <label for="temperatura">Temperatura (°C)</label>
                <input type="number" step="0.1" id="temperatura" placeholder="Ex: 36.5">
            </div>
        </div>

        <div class="form-group">
            <label for="alergias">Alergias Conhecidas</label>
            <input type="text" id="alergias" placeholder="Ex: Dipirona, Penicilina (deixe em branco se não houver)">
        </div>

        <div class="form-group">
            <label for="sintomas">Relato de Sintomas *</label>
            <textarea id="sintomas" rows="3" placeholder="Descreva as queixas do paciente..." required></textarea>
        </div>

        <button type="submit">Enviar Dados</button>
    </form>

    <div id="responseMessage" class="message"></div>
</div>

<script>
    // 👇 INTELIGÊNCIA DA TRIAGEM: Monitora a idade enquanto a enfermeira digita
    document.getElementById('idade').addEventListener('input', function() {
        const idade = parseInt(this.value);
        const urgenciaSelect = document.getElementById('nivelUrgencia');
        const alerta = document.getElementById('alertaIdade');

        if (idade >= 80) {
            alerta.style.display = 'block';
            alerta.innerText = '⚠️ Risco Crítico: Paciente superidoso (+80)';
            urgenciaSelect.value = 'Vermelho'; // Joga direto pro topo da fila
        } else if (idade >= 60) {
            alerta.style.display = 'block';
            alerta.innerText = '⚠️ Risco Elevado: Paciente idoso (+60)';
            if (urgenciaSelect.value === '' || urgenciaSelect.value === 'Verde') {
                urgenciaSelect.value = 'Amarelo'; // Sobe o nível se estiver baixo
            }
        } else {
            alerta.style.display = 'none';
        }
    });

    document.getElementById('formTriagem').addEventListener('submit', async (e) => {
        e.preventDefault();

        const msgDiv = document.getElementById('responseMessage');

        // 👇 Coletando os dados (agora incluindo as alergias)
        const dadosTriagem = {
            pacienteNome: document.getElementById('pacienteNome').value,
            cpf: document.getElementById('cpf').value,
            idade: parseInt(document.getElementById('idade').value) || null,
            pressaoArterial: document.getElementById('pressaoArterial').value,
            temperatura: parseFloat(document.getElementById('temperatura').value) || null,
            alergias: document.getElementById('alergias').value, // <-- Enviando para o Java
            sintomas: document.getElementById('sintomas').value,
            nivelUrgencia: document.getElementById('nivelUrgencia').value
        };

        try {
            const response = await fetch('http://localhost:8080/api/triagem', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dadosTriagem)
            });

            const text = await response.text();
            const result = text ? JSON.parse(text) : {};

            if (response.ok) {
                msgDiv.style.backgroundColor = '#e6f4ea';
                msgDiv.style.color = '#137333';

                msgDiv.innerHTML = `
                    ${result.message} <br><br>
                    <div style="background-color: #ffffff; padding: 15px; border-radius: 8px; border: 2px dashed #137333; margin-top: 10px;">
                        🔐 <strong style="font-size: 14px;">Senha de Acesso Gerada:</strong><br>
                        <span style="font-size: 26px; color: #004b49; letter-spacing: 3px; font-weight: 800; display: block; margin-top: 5px;">${result.senha}</span>
                    </div>
                    <small style="display: block; margin-top: 10px; color: #666;">Por favor, anote esta senha ou informe ao paciente.</small>
                `;

                document.getElementById('formTriagem').reset();
                document.getElementById('alertaIdade').style.display = 'none'; // Reseta o alerta visual
            } else {
                throw new Error(result.error || 'Erro ao enviar para a API. Verifique os dados.');
            }
        } catch (error) {
            msgDiv.style.backgroundColor = '#fce8e6';
            msgDiv.style.color = '#c5221f';
            msgDiv.innerText = 'Erro ao processar: ' + error.message;
        }

        msgDiv.style.display = 'block';
    });
</script>

</body>
</html>
