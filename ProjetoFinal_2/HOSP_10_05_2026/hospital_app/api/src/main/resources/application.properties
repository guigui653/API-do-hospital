spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

api.security.token.secret=${JWT_SECRET:senha_super_secreta_hospital_123}

# Define a porta da sua API (padrão é 8080)
server.port=8080

# Garante que a API vai aceitar requisições do seu IP da rede Wi-Fi (0.0.0.0 libera para todos os IPs locais)
server.address=0.0.0.0